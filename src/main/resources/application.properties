spring.application.name=hotel

# Render asigna el puerto en la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# Base de datos H2 en memoria (se reinicia en cada arranque)
spring.datasource.url=jdbc:h2:mem:hoteldb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas y luego se ejecuta data.sql con los datos de ejemplo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false

# Consola web de H2 en /h2-console (solo accesible desde la misma máquina)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
